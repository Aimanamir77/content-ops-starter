<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loan Calculator</title>
  <style>
    body { font-family: Arial; padding: 40px; background: #f5f5f5; }
    .container { background: white; padding: 20px; max-width: 500px; margin: auto; border-radius: 8px; }
    input, button { width: 100%; padding: 10px; margin: 10px 0; }
    #result, #lead-form { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Loan Calculator</h2>
    <input type="number" id="amount" placeholder="Loan Amount ($)">
    <input type="number" id="rate" placeholder="Interest Rate (%)">
    <input type="number" id="years" placeholder="Loan Term (years)">
    <button onclick="calculateLoan()">Calculate</button>

    <div id="result"></div>

    <div id="lead-form">
      <h3>Get Your Full Report</h3>
      <input type="text" id="name" placeholder="Your Name">
      <input type="email" id="email" placeholder="Your Email">
      <button onclick="submitLead()">Submit</button>
    </div>
  </div>

  <script>
    function calculateLoan() {
      const P = parseFloat(document.getElementById('amount').value);
      const r = parseFloat(document.getElementById('rate').value) / 100 / 12;
      const n = parseFloat(document.getElementById('years').value) * 12;

      const payment = (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
      if (!isNaN(payment)) {
        document.getElementById('result').innerHTML = 
          `<p>Your monthly payment: <strong>$${payment.toFixed(2)}</strong></p>`;
        document.getElementById('result').style.display = 'block';
        document.getElementById('lead-form').style.display = 'block';
      } else {
        alert('Please enter valid numbers');
      }
    }

    function submitLead() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;

      if (name && email) {
        console.log('Lead captured:', { name, email });
        alert("Thanks! We'll email your full report soon.");
        // In real use: send to server or database here
      } else {
        alert('Please fill in your name and email.');
      }
    }
  </script>

</body>
</html>
